# Coding Exam Template

exam:
  id: "exam_coding_template"
  title: "Coding Challenge Exam Template"
  description: "Template for creating coding challenge exams"
  type: "coding"
  
  # General settings
  duration: 120  # minutes
  total_points: 100
  passing_score: 70
  
  # Access control
  access_control:
    minimum_tier: "intermediate"
    prerequisites: ["completed_python_basics"]
    attempts_allowed: 2
  
  # Proctoring
  proctoring:
    enabled: true
    strictness: "standard"
    recording:
      webcam: true
      screen: false
  
  # Grading
  grading:
    auto_publish: false  # Manual review for code quality
    show_correct_answers: false
    allow_regrade: true
  
  # Questions
  questions:
    - id: "q1_fibonacci"
      type: "coding"
      prompt: |
        Implement a function that returns the nth Fibonacci number.
        
        Example:
        fibonacci(5) -> 5
        fibonacci(10) -> 55
        
        Constraints:
        - 0 <= n <= 30
        - Use dynamic programming for efficiency
      
      language: "python"
      
      starter_code: |
        def fibonacci(n):
            """
            Calculate the nth Fibonacci number.
            
            Args:
                n: Integer index (0-based)
            
            Returns:
                The nth Fibonacci number
            """
            # Your code here
            pass
      
      test_cases:
        - input: 0
          expected: 0
        - input: 1
          expected: 1
        - input: 5
          expected: 5
        - input: 10
          expected: 55
        - input: 20
          expected: 6765
      
      rubric_id: "coding_rubric"
      
      points: 30
      time_limit: 30  # seconds per test
      memory_limit: 512  # MB
      
      allowed_imports: ["math"]
      forbidden_imports: ["os", "sys", "subprocess"]
      
    - id: "q2_binary_search"
      type: "coding"
      prompt: |
        Implement binary search on a sorted array.
        
        Return the index of the target element, or -1 if not found.
        
        Example:
        binary_search([1, 2, 3, 4, 5], 3) -> 2
        binary_search([1, 2, 3, 4, 5], 6) -> -1
      
      language: "python"
      
      starter_code: |
        def binary_search(arr, target):
            """
            Perform binary search on sorted array.
            
            Args:
                arr: Sorted list of integers
                target: Integer to search for
            
            Returns:
                Index of target, or -1 if not found
            """
            # Your code here
            pass
      
      test_cases:
        - input: [[1, 2, 3, 4, 5], 3]
          expected: 2
        - input: [[1, 2, 3, 4, 5], 6]
          expected: -1
        - input: [[1], 1]
          expected: 0
        - input: [[], 1]
          expected: -1
      
      rubric_id: "coding_rubric"
      
      points: 30
      
    - id: "q3_code_review"
      type: "coding"
      prompt: |
        Refactor the following code to improve quality:
        
        ```python
        def f(x):
            if x > 0:
                return x * 2
            else:
                return x * 3
        ```
        
        Requirements:
        - Descriptive function and variable names
        - Type hints
        - Docstring
        - Handle edge cases
      
      language: "python"
      
      starter_code: |
        def f(x):
            if x > 0:
                return x * 2
            else:
                return x * 3
      
      rubric_id: "coding_rubric"
      
      points: 40
      
      # Manual grading required for code quality
      auto_grading:
        enabled: false
