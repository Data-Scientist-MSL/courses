# Example Security Standards - Credentials Detection

standard:
  id: "SEC-CREDENTIALS"
  name: "Credential Security Standard"
  version: "1.0.0"
  category: "security"
  subcategory: "credentials"
  description: "Standards for preventing hardcoded credentials and secrets"
  last_updated: "2026-01-12"

profiles:
  strict:
    enabled: true
    pass_threshold: 1.0
    blocking_on_failure: true
  standard:
    enabled: true
    pass_threshold: 1.0
    blocking_on_failure: true
  relaxed:
    enabled: true
    pass_threshold: 1.0  # Even relaxed requires no credentials
    blocking_on_failure: true

requirements:
  - id: "SEC-CRED-001"
    name: "No hardcoded passwords"
    description: "Code must not contain hardcoded passwords"
    severity: "critical"
    blocking: true
    auto_fixable: false
    check_type: "automated"
    
    validation:
      method: "scan_patterns"
      parameters:
        patterns:
          - 'password\s*=\s*["\'][^"\']+["\']'
          - 'passwd\s*=\s*["\'][^"\']+["\']'
          - 'pwd\s*=\s*["\'][^"\']+["\']'
    
    pass_criteria:
      - "No password variables with hardcoded values"
      - "Passwords loaded from environment or secure storage"
    
    remediation:
      auto_fix: false
      suggestion: "Use environment variables: password = os.environ.get('PASSWORD')"
      documentation_url: "https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password"

  - id: "SEC-CRED-002"
    name: "No hardcoded API keys"
    description: "Code must not contain hardcoded API keys"
    severity: "critical"
    blocking: true
    auto_fixable: false
    check_type: "automated"
    
    validation:
      method: "scan_patterns"
      parameters:
        patterns:
          - 'api[_-]?key\s*=\s*["\'][^"\']+["\']'
          - 'AIza[0-9A-Za-z_-]{35}'  # Google API key
          - 'sk-[a-zA-Z0-9]{48}'      # OpenAI API key
    
    pass_criteria:
      - "No API keys in source code"
      - "API keys loaded from environment or secrets manager"
    
    remediation:
      auto_fix: false
      suggestion: "Use environment variables: api_key = os.environ.get('API_KEY')"
      documentation_url: "https://owasp.org/www-project-api-security/"

related_standards:
  - "SEC-SECRETS"
  - "SEC-PII"

changelog:
  - version: "1.0.0"
    date: "2026-01-12"
    changes: "Initial credential security standard"
