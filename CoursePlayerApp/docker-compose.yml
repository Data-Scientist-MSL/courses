version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: courseplayerapp_postgres
    environment:
      POSTGRES_DB: courseplayerapp
      POSTGRES_USER: courseuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courseplayerapp_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: courseplayerapp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courseplayerapp_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courseplayerapp_backend
    environment:
      - DATABASE_URL=postgresql://courseuser:${DB_PASSWORD}@postgres:5432/courseplayerapp
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - COURSESGTM_API_URL=${COURSESGTM_API_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - courseplayerapp_network

  # Celery Worker (for background tasks)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courseplayerapp_celery
    environment:
      - DATABASE_URL=postgresql://courseuser:${DB_PASSWORD}@postgres:5432/courseplayerapp
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info
    networks:
      - courseplayerapp_network

  # Celery Beat (for scheduled tasks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courseplayerapp_celery_beat
    environment:
      - DATABASE_URL=postgresql://courseuser:${DB_PASSWORD}@postgres:5432/courseplayerapp
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - courseplayerapp_network

  # OLLAMA (AI Service)
  # Note: Requires GPU support for optimal performance
  ollama:
    image: ollama/ollama:latest
    container_name: courseplayerapp_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - courseplayerapp_network

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: courseplayerapp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    networks:
      - courseplayerapp_network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  courseplayerapp_network:
    driver: bridge
