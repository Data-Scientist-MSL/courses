version: '3.8'

services:
  # Streamlit App - Main Learning Platform
  streamlit-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: ds-learning-app
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app/streamlit_app
      - ./01_Core_AI_ML:/app/01_Core_AI_ML
      - ./docs:/app/docs
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    networks:
      - ds-network
    restart: unless-stopped

  # OLLAMA - Local LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: ds-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - ds-network
    restart: unless-stopped
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Nginx - Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: ds-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - streamlit-app
    networks:
      - ds-network
    restart: unless-stopped

volumes:
  ollama-data:
    driver: local

networks:
  ds-network:
    driver: bridge
