version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: ds-specialization-app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=ollama:11434
      - REDIS_HOST=redis:6379
    volumes:
      - ./courses-v2:/app/courses-v2
      - ./legacy:/app/legacy
    depends_on:
      - ollama
      - redis
    networks:
      - ds-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ds-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ds-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # For CPU-only systems, comment out the deploy section above

  nginx:
    image: nginx:alpine
    container_name: ds-nginx
    ports:
      - "80:80"
    volumes:
      - ./courses-v2/interactive_app/deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - streamlit-app
    networks:
      - ds-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ds-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ds-network
    restart: unless-stopped

volumes:
  ollama-data:
    driver: local
  redis-data:
    driver: local

networks:
  ds-network:
    driver: bridge
